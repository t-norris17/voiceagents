<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robin — Experiment Monitor</title>
<style>
  :root {
    --paper:#f2f0ea; --ink:#17181c; --sub:#6c7075; --faint:#a29e95;
    --line:#d7d3c9; --hair:#e4e1d8;
    --accent:#b8501e;
    --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#15161a; --ink:#ecebe6; --sub:#9a9ea4; --faint:#6a6e74;
      --line:#2b2d33; --hair:#212329; --accent:#e08a4a; }
  }
  :root[data-theme="light"]{ --paper:#f2f0ea; --ink:#17181c; --sub:#6c7075; --faint:#a29e95; --line:#d7d3c9; --hair:#e4e1d8; --accent:#b8501e; }
  :root[data-theme="dark"]{ --paper:#15161a; --ink:#ecebe6; --sub:#9a9ea4; --faint:#6a6e74; --line:#2b2d33; --hair:#212329; --accent:#e08a4a; }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.5; -webkit-font-smoothing:antialiased; }
  .sheet{ max-width:820px; margin:0 auto; padding:clamp(28px,6vw,64px) clamp(20px,5vw,44px) 60px; }
  .tnum{ font-variant-numeric:tabular-nums; }
  .lbl{ font-size:.66rem; text-transform:uppercase; letter-spacing:.2em; color:var(--sub); font-weight:600; }
  .accent{ color:var(--accent); }

  .mast{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
  .mast .wm{ font-size:1.4rem; font-weight:800; letter-spacing:.02em; text-transform:uppercase; margin:0; }
  .mast .meta{ font-size:.72rem; color:var(--sub); text-align:right; line-height:1.7; letter-spacing:.02em; }
  .mast .meta b{ color:var(--ink); font-weight:600; }
  .themebtn{ font:inherit; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; background:none; border:0; color:var(--sub); cursor:pointer; padding:0; margin-left:10px; }
  .themebtn:hover{ color:var(--ink); }

  .verdict{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:38px; }
  .v{ padding:2px 24px; border-left:1px solid var(--line); }
  .v:first-child{ padding-left:0; border-left:0; }
  .v .k{ margin-bottom:14px; }
  .v .fig{ font-size:clamp(2.6rem,7vw,3.5rem); font-weight:800; line-height:.9; letter-spacing:-.03em; }
  .v .fig .un{ font-size:1rem; font-weight:600; color:var(--sub); letter-spacing:0; margin-left:4px; }
  .v .note{ font-size:.8rem; color:var(--sub); margin-top:12px; line-height:1.45; }
  .v .note b{ color:var(--ink); font-weight:600; }

  hr.rule{ border:0; border-top:1px solid var(--line); margin:44px 0 0; }

  section{ margin-top:40px; }
  .shead{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:2px; }
  .tabset{ display:flex; gap:18px; }
  .tabset button{ font:inherit; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); background:none; border:0; padding:0 0 4px; cursor:pointer; border-bottom:2px solid transparent; }
  .tabset button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--ink); }
  .tabset button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  thead th{ font-size:.62rem; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); font-weight:600; text-align:left; padding:14px 0 8px; border-bottom:1px solid var(--ink); }
  th.r,td.r{ text-align:right; }
  thead th.r{ padding-left:26px; white-space:nowrap; }

  .catrow td{ padding:22px 0 7px; border-bottom:1px solid var(--ink); }
  .catrow .lbl{ letter-spacing:.16em; }
  .catrow .cnt{ color:var(--faint); font-weight:400; }

  tr.q{ cursor:pointer; }
  tr.q > td{ padding:11px 0; border-bottom:1px solid var(--hair); }
  tr.q:hover > td{ color:var(--ink); }
  tr.q:hover .qtext{ text-decoration:underline; text-underline-offset:3px; }
  tr.q:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .qcell{ font-weight:600; display:flex; align-items:baseline; gap:9px; }
  .caret{ color:var(--faint); font-size:.7rem; width:9px; flex:none; transition:transform .15s ease; display:inline-block; }
  tr.q[aria-expanded="true"] .caret{ transform:rotate(90deg); color:var(--ink); }
  .qsub{ display:block; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400; margin:2px 0 0 18px; }
  td.r.num{ font-variant-numeric:tabular-nums; width:1%; white-space:nowrap; padding-left:26px; }
  .weak{ color:var(--accent); font-weight:700; }
  .dash{ color:var(--faint); }
  .state{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); white-space:nowrap; }
  .state.attn{ color:var(--accent); font-weight:700; }
  tr.q.notasked{ cursor:default; }
  tr.q.notasked:hover .qtext{ text-decoration:none; }

  tr.detail > td{ padding:0; border-bottom:1px solid var(--hair); }
  .answers{ margin:2px 0 14px 18px; padding-left:16px; border-left:1px solid var(--line); }
  .ans{ display:grid; grid-template-columns:1fr auto; gap:4px 18px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--hair); }
  .ans:last-child{ border-bottom:0; }
  .ans-text{ font-size:.86rem; color:var(--ink); }
  .ans-meta{ font-size:.72rem; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ans-meta .s{ margin-left:10px; }
  .ans-note{ grid-column:1/-1; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:600; margin-top:2px; }

  .rq-item{ display:grid; grid-template-columns:1fr auto; gap:6px 16px; padding:12px 0; border-bottom:1px solid var(--hair); align-items:baseline; }
  .rq-item:last-child{ border-bottom:0; }
  .rq-topic{ font-weight:600; } .rq-id{ font-size:.72rem; color:var(--faint); letter-spacing:.03em; }
  .rq-reason{ font-size:.78rem; color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .rq-meta{ font-size:.78rem; color:var(--sub); }

  .callrow{ display:grid; grid-template-columns:1fr auto; gap:2px 16px; padding:11px 0; border-bottom:1px solid var(--hair); align-items:baseline; }
  .callrow:last-child{ border-bottom:0; }
  .call-main{ font-weight:600; font-size:.9rem; }
  .call-id{ font-size:.7rem; color:var(--faint); letter-spacing:.03em; }
  .call-meta{ font-size:.78rem; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pill{ font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; padding:1px 7px; border:1px solid var(--line); border-radius:2px; margin-left:8px; }
  .pill.ok{ color:var(--sub); } .pill.bad{ color:var(--accent); border-color:var(--accent); }

  /* utilization — one bar, read left to right: answered | fixable gap | not-content */
  .util{ margin-top:10px; }
  .util .fig{ font-size:clamp(2.6rem,7vw,3.5rem); font-weight:800; line-height:.9; letter-spacing:-.03em; }
  .util .fig .un{ font-size:1rem; font-weight:600; color:var(--sub); letter-spacing:0; margin-left:4px; }
  .bar{ display:flex; height:14px; margin:16px 0 10px; border:1px solid var(--ink); background:var(--paper); overflow:hidden; }
  .bar span{ display:block; height:100%; }
  .bar .b-ans{ background:var(--ink); }
  .bar .b-gap{ background:var(--accent); }
  .bar .b-oos{ background:var(--line); }
  .key{ display:flex; gap:18px; flex-wrap:wrap; font-size:.72rem; color:var(--sub); }
  .key i{ display:inline-block; width:9px; height:9px; margin-right:6px; border:1px solid var(--ink); vertical-align:baseline; }
  .key .k-ans i{ background:var(--ink); } .key .k-gap i{ background:var(--accent); } .key .k-oos i{ background:var(--line); }

  .gap{ display:grid; grid-template-columns:1fr auto; gap:4px 16px; padding:13px 0; border-bottom:1px solid var(--hair); align-items:baseline; }
  .gap:last-child{ border-bottom:0; }
  .gap-q{ font-weight:600; }
  .gap-meta{ font-size:.72rem; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .gap-why{ grid-column:1/-1; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; font-weight:600; color:var(--accent); }
  .gap-why.soft{ color:var(--faint); }
  .gap-sample{ grid-column:1/-1; font-size:.8rem; color:var(--sub); font-style:italic; }
  .gap-act{ grid-column:1/-1; margin-top:6px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .gap-act button{ font:inherit; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; background:none; border:1px solid var(--line); color:var(--sub); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .gap-act button:hover{ border-color:var(--accent); color:var(--accent); }
  .gap-act button[disabled]{ opacity:.55; cursor:default; }
  .gap-status{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); }

  .empty{ color:var(--faint); font-size:.85rem; font-style:italic; padding:16px 0; }
  .banner{ font-size:.72rem; letter-spacing:.04em; color:var(--sub); background:var(--hair); padding:9px 14px; border-radius:2px; margin-top:18px; }

  /* pipeline strip — where every call is right now, and what to do about the stuck ones */
  .pipe{ margin-top:14px; border:1px solid var(--line); border-radius:3px; padding:14px 16px; }
  .pipe.trouble{ border-color:var(--accent); }
  .pipesteps{ display:flex; flex-wrap:wrap; gap:0; align-items:stretch; }
  .ps{ flex:1; min-width:104px; padding:0 16px; border-left:1px solid var(--hair); }
  .ps:first-child{ padding-left:0; border-left:0; }
  .ps .n{ font-size:1.5rem; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .ps .t{ font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); margin-top:3px; }
  .ps.warn .n, .ps.warn .t{ color:var(--accent); }
  .ps.warn .t{ font-weight:700; }
  .ps.zero .n{ color:var(--faint); }
  .pipenote{ margin-top:12px; padding-top:11px; border-top:1px solid var(--hair); font-size:.8rem; color:var(--sub); line-height:1.55; }
  .pipenote + .pipenote{ border-top:0; padding-top:4px; }
  .pipenote b{ color:var(--ink); font-weight:600; }
  .pipenote.bad b, .pipenote.bad strong{ color:var(--accent); }
  .pipenote code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9em; }
  .pipetog{ font:inherit; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; background:none; border:0; color:var(--sub); cursor:pointer; padding:0; }
  .pipetog:hover{ color:var(--ink); }
  .callrow .state{ margin-left:8px; }

  footer{ margin-top:52px; padding-top:14px; border-top:1px solid var(--line); font-size:.68rem; letter-spacing:.04em; color:var(--faint); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  @media (max-width:640px){
    .verdict{ grid-template-columns:1fr; gap:28px; } .v{ padding:0; border-left:0; }
    .v+.v{ border-top:1px solid var(--line); padding-top:24px; }
    thead .hidesm, td.hidesm{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>
</head>
<body>
<div class="sheet">

  <div class="mast">
    <h1 class="wm">Robin</h1>
    <div class="meta" id="mastmeta">
      loading…
      <button class="themebtn" id="theme">Theme</button>
    </div>
  </div>

  <div class="verdict" id="verdict">
    <div class="v"><div class="k lbl">Security</div><div class="fig">—</div></div>
    <div class="v"><div class="k lbl">Experience</div><div class="fig">—</div></div>
    <div class="v"><div class="k lbl">Coverage</div><div class="fig">—</div></div>
  </div>

  <div id="banner"></div>

  <section id="pipesec" style="margin-top:24px">
    <div class="shead"><div class="lbl">Where your calls are · <span id="pipemeta"></span></div></div>
    <div id="pipe"></div>
  </section>

  <hr class="rule">

  <section>
    <div class="shead">
      <div class="tabset" role="group" aria-label="Group by">
        <button data-view="question" aria-pressed="true">One by one</button>
        <button data-view="category" aria-pressed="false">Grouped</button>
      </div>
      <div class="tabset" role="group" aria-label="Filter">
        <button data-q="all" aria-pressed="true">Everything</button>
        <button data-q="attention" aria-pressed="false">Needs work</button>
        <button data-q="gaps" aria-pressed="false">Never come up</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>What people asked</th><th class="r">Times</th><th class="r">How she did</th><th class="r hidesm">Mood</th><th class="r hidesm">&nbsp;</th></tr>
      </thead>
      <tbody id="qbody"></tbody>
    </table>
  </section>

  <section>
    <div class="shead"><div class="lbl">How much she's handling · <span id="utilmeta"></span></div></div>
    <div id="util"></div>
  </section>

  <section>
    <div class="shead"><div class="lbl">Waiting on an answer · <span id="gapcount"></span></div></div>
    <div id="gaps"></div>
  </section>

  <section>
    <div class="shead"><div class="lbl">Recent calls · <span id="callcount"></span></div></div>
    <div id="calls"></div>
  </section>

  <section>
    <div class="shead"><div class="lbl">Worth a listen · <span id="rqcount"></span></div></div>
    <div id="rq"></div>
  </section>

  <footer>
    <span>Robin · Vertex Manufacturing 401(k) · <span id="gen"></span></span>
    <span>Every answer checked against the plan documents she actually read</span>
  </footer>
</div>

<script>
  const SENT={positive:"▲ pos",neutral:"■ neu",negative:"▼ neg",mixed:"◆ mix"};
  let DATA=null, HEALTH=null, GRADE_ERR=null, view="question", filt="all";

  const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const shortRef=(r)=>r?String(r).slice(0,8):"—";
  const dur=(s)=>s==null?"—":`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const when=(iso)=>{ if(!iso)return "—"; try{ const d=new Date(iso); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(_){return "—";} };
  const ago=(iso)=>{
    if(!iso) return null;
    const ms = Date.now() - new Date(iso).getTime();
    if(!isFinite(ms)) return null;
    const m = Math.round(ms/60000);
    if(m < 1) return "just now";
    if(m < 60) return `${m} min ago`;
    const h = Math.round(m/60);
    return h < 36 ? `${h} hour${h===1?"":"s"} ago` : `${Math.round(h/24)} days ago`;
  };

  async function load(){
    try{
      const r=await fetch("/api/metrics",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      DATA=await r.json();
      paint();
    }catch(e){
      // A dead /api/metrics is itself a diagnosis, so ask the health endpoint what's missing
      // rather than leaving "retrying…" on screen forever.
      await loadHealth();
      const fatal = (HEALTH?.problems||[]).filter(p=>p.severity==="fatal");
      document.getElementById("banner").innerHTML=
        `<div class="banner">Couldn't load live data: ${esc(e.message)}.`
        + (fatal.length ? ` ${fatal.map(p=>`<b>${esc(p.what)}.</b> ${esc(p.fix)}`).join(" ")}` : " Retrying…")
        + `</div>`;
    }
  }

  // Config problems are the cause of most "it's not working" — and none of them are visible from
  // the data alone, because a misconfigured deployment returns the same empty tables as a quiet
  // one. Checked once on load and after any failure; it reports presence of settings, never values.
  async function loadHealth(){
    try{
      const r=await fetch("/api/health",{cache:"no-store"});
      HEALTH = r.ok ? await r.json() : null;
    }catch(_){ HEALTH=null; }
  }

  function paint(){
    const d=DATA; if(!d) return;
    document.getElementById("mastmeta").innerHTML=
      `<b>${d.window.calls}</b> call${d.window.calls===1?"":"s"} so far<br>`+
      `<span class="soft">last updated <span id="gen2"></span></span> <button class="themebtn" id="theme">Theme</button>`;
    wireTheme();

    // Verdict tiles
    const s=d.security, x=d.experience, u=d.utilization||{};
    const openGaps = (d.gaps||[]).filter(g=>g.status!=="resolved" && (g.top_reason==="no_content"||g.top_reason==="not_retrieved")).length;
    const secNote = s.total_auth
      ? `${s.flags?`<span class="accent">${s.flags} call${s.flags===1?"":"s"} worth a look.</span>`:"She never said a Social Security number, password or PIN."}${s.verified_pct!=null?` ${s.verified_pct}% of callers verified${s.failed?`; ${s.failed} handed to a person`:""}.`:""}`
      : "Nobody has been through identity checks yet.";
    const expFig = x.graded ? `${x.avg_quality.toFixed(1)}<span class="un">/5</span>` : "—";
    const expNote = x.graded
      ? `Checked ${x.scored_count} answer${x.scored_count===1?"":"s"} line by line against the plan documents she read.`
      : `We haven't checked her answers yet.`;
    document.getElementById("verdict").innerHTML=`
      <div class="v"><div class="k lbl">She answered</div><div class="fig tnum">${u.pct==null?"—":u.pct}<span class="un">%</span></div>
        <div class="note">${u.total_asked?`${u.answered} of the ${u.total_asked} things people asked her.`:"Nothing asked yet."}</div></div>
      <div class="v"><div class="k lbl">And got it right</div><div class="fig tnum">${expFig}</div><div class="note">${expNote}</div></div>
      <div class="v"><div class="k lbl">Still stuck on</div><div class="fig tnum">${openGaps}</div>
        <div class="note">${openGaps?`question${openGaps===1?"":"s"} waiting for an answer to be written.`:"Nothing — she's handled everything so far."}</div></div>`;

    // The pipeline strip carries the "why is it empty" story now, so the banner only speaks when
    // there's genuinely nothing wrong and nothing scored yet.
    const p = d.pipeline || {};
    document.getElementById("banner").innerHTML = (x.graded || p.awaiting_grading || p.no_transcript || p.rejected_recent) ? "" :
      `<div class="banner">Calls are coming in — ${d.window.calls} so far. The table below fills in once we've checked her answers.</div>`;

    { const w=when(d.generated_at);
      const g1=document.getElementById("gen"); if(g1) g1.textContent="updated "+w;
      const g2=document.getElementById("gen2"); if(g2) g2.textContent=w; }
    renderPipeline();
    renderQuestions();
    renderUtilization();
    renderGaps();
    renderCalls();
    renderReview();
  }

  // Every way a call can fail to arrive, in the words of what you'd do about it. These are the
  // reasons /api/postcall records when it turns a webhook away.
  const REJECT = {
    no_secret:          "This deployment has no webhook secret set, so it turned every call away. Add ELEVENLABS_WEBHOOK_SECRET and redeploy.",
    bad_signature:      "The signature didn't match — the secret here and the one in the ElevenLabs webhook settings are different. Copy the signing secret from ElevenLabs into this deployment.",
    unparseable:        "The webhook body wasn't readable JSON. Check the webhook's payload settings in ElevenLabs.",
    no_conversation_id: "The webhook arrived without a conversation id, so there was nothing to file the call under. Check which event type the webhook is sending.",
    write_failed:       "The call was accepted but couldn't be saved to the database.",
    wrong_method:       "Something sent a non-POST request to the webhook address.",
  };

  // "Where your calls are" — one row per hop a call makes, so an empty dashboard names its own
  // cause instead of looking the same as a quiet afternoon.
  function renderPipeline(){
    const el2=document.getElementById("pipe"), p=DATA.pipeline||{};
    const meta=document.getElementById("pipemeta");
    const received=p.received||0, graded=p.graded||0, waiting=p.awaiting_grading||0, stuck=p.no_transcript||0;
    const rejected=p.rejected_recent||0;
    const trouble = rejected>0 || stuck>0 || p.stalled || GRADE_ERR || (HEALTH?.problems||[]).some(x=>x.severity==="fatal");

    meta.textContent = p.last_call_at ? `last call ${ago(p.last_call_at)}` : "no calls yet";

    const step=(n,t,cls)=>`<div class="ps ${cls||""} ${n?"":"zero"}"><div class="n tnum">${n}</div><div class="t">${t}</div></div>`;
    // When the ingest log isn't there this reads "?", never "0". A deployment that can't see
    // rejections claiming there were none is the same silence the strip exists to break.
    const turnedAway = p.ingest_log_available === false
      ? `<div class="ps zero"><div class="n tnum">?</div><div class="t">turned away</div></div>`
      : (rejected ? step(rejected,"turned away","warn") : "");
    let h = `<div class="pipe${trouble?" trouble":""}">
      <div class="pipesteps">
        ${step(received,"arrived")}
        ${step(graded,"checked")}
        ${step(waiting,"waiting to be checked", waiting&&p.stalled?"warn":"")}
        ${step(stuck,"can't be checked", stuck?"warn":"")}
        ${turnedAway}
      </div>`;

    const notes=[];

    // Rejections first: a call that never landed is the one the user is actually looking for.
    if(rejected){
      const byReason = p.rejected_by_reason||{};
      for(const [reason,g] of Object.entries(byReason)){
        notes.push(`<div class="pipenote bad"><b>${g.count} call${g.count===1?"":"s"} turned away</b> — ${esc(REJECT[reason]||reason)} <span style="color:var(--faint)">(most recent ${esc(ago(g.last_at)||"unknown")})</span></div>`);
      }
    }

    if(stuck)
      notes.push(`<div class="pipenote bad"><b>${stuck} call${stuck===1?"":"s"} arrived without a transcript</b>, so there's nothing to check her answers against. They're listed below but will never be scored. In ElevenLabs, make sure the <b>post-call transcription</b> webhook is the one pointed here.</div>`);

    if(waiting)
      notes.push(`<div class="pipenote"><b>${waiting} call${waiting===1?"":"s"} waiting to be checked.</b> Checking runs while this page is open, ten calls at a time — leave the tab open and they'll fill in.${p.stalled?` The oldest has been waiting since ${esc(when(p.oldest_awaiting_at))}, which usually means checking is failing rather than queuing.`:""}</div>`);

    if(GRADE_ERR)
      notes.push(`<div class="pipenote bad"><b>Checking answers is failing:</b> ${esc(GRADE_ERR)}</div>`);

    // Config problems, from /api/health. These explain the ones above rather than repeating them.
    for(const prob of (HEALTH?.problems||[]))
      notes.push(`<div class="pipenote ${prob.severity==="fatal"?"bad":""}"><b>${esc(prob.what)}.</b> ${esc(prob.fix)}</div>`);

    if(p.ingest_log_available === false)
      notes.push(`<div class="pipenote">Calls that were <i>turned away</i> can't be counted on this deployment — the <code>webhook_ingest_log</code> table hasn't been created yet. Run <code>broker/supabase/migrations/003_webhook_ingest_log.sql</code> and rejected calls will start showing up here instead of disappearing.</div>`);

    if(!notes.length)
      notes.push(`<div class="pipenote">${received ? `Everything that arrived has been checked.${p.last_webhook_at?` Last webhook ${esc(ago(p.last_webhook_at))}.`:""}` : `No calls have arrived yet. When one does it appears here within a minute.`}</div>`);

    el2.innerHTML = h + notes.join("") + `</div>`;
  }

  const WHY = {
    no_content:   ["Nothing written about this yet",       false],
    not_retrieved:["We've written this — she missed it",   false],
    out_of_scope: ["Not something an article can answer",  true ],
    guardrail:    ["She was right to say no",              true ],
  };

  // Utilization: of everything callers asked Robin, how much did she actually answer?
  // The bar separates the fixable gap (write an article) from the part no content can fix.
  function renderUtilization(){
    const el2=document.getElementById("util"), u=DATA.utilization||{};
    const total=u.total_asked||0;
    document.getElementById("utilmeta").textContent = total ? `${u.answered} of ${total} answered` : "";
    if(!total){ el2.innerHTML=`<div class="empty">Nothing to show yet. This fills in after the first few calls.</div>`; return; }
    const ans=u.answered||0, fix=u.addressable_gap||0, oos=Math.max(0, total-ans-fix);
    const pc=(n)=>((n/total)*100).toFixed(2)+"%";
    el2.innerHTML=`
      <div class="util">
        <div class="bar" role="img" aria-label="${ans} answered, ${fix} fixable gap, ${oos} not content">
          <span class="b-ans" style="width:${pc(ans)}"></span>
          <span class="b-gap" style="width:${pc(fix)}"></span>
          <span class="b-oos" style="width:${pc(oos)}"></span>
        </div>
        <div class="key">
          <span class="k-ans"><i></i>${ans} she answered</span>
          <span class="k-gap"><i></i>${fix} we could fix by writing something</span>
          <span class="k-oos"><i></i>${oos} needed a person, or she was right to decline</span>
        </div>
        <div class="note" style="font-size:.72rem;color:var(--faint);margin-top:10px">
          Out of everything asked on calls that reached her.
          ${fix?`Write those ${fix} answer${fix>1?"s":""} and she'd be at <b>${Math.round(((ans+fix)/total)*100)}%</b>.`:""}
        </div>
      </div>`;
  }

  // The feedback loop's output: what Robin was asked and couldn't answer, ranked by demand.
  function renderGaps(){
    const el2=document.getElementById("gaps"), gaps=DATA.gaps||[];
    const writable = gaps.filter(g=>!(WHY[g.top_reason]||WHY.no_content)[1]).length;
    document.getElementById("gapcount").textContent =
      gaps.length ? (writable ? `${writable} to write` : "nothing to write") : "all clear";
    if(!gaps.length){ el2.innerHTML=`<div class="empty">She's answered everything that's come up so far.</div>`; return; }
    el2.innerHTML="";
    gaps.forEach(g=>{
      const [label, soft] = WHY[g.top_reason] || WHY.no_content;
      const d=document.createElement("div"); d.className="gap";
      const resolved = g.status==="resolved";
      d.innerHTML=`
        <div class="gap-q">${esc(g.question)}</div>
        <div class="gap-meta">asked ${g.count}×${g.category?" · "+esc(g.category):""}</div>
        <div class="gap-why${soft?" soft":""}">${label}</div>
        ${g.samples&&g.samples.length?`<div class="gap-sample">“${esc(g.samples[0])}”</div>`:""}`;
      const act=document.createElement("div"); act.className="gap-act";
      const st=document.createElement("span"); st.className="gap-status"; st.textContent=g.status==="new"?"":g.status;
      if(!soft && !resolved && g.status==="new"){
        const b=document.createElement("button");
        b.textContent = "Ask for this";
        b.addEventListener("click", ()=>markGap(g, b, st));
        act.append(b);
      }
      if(g.status==="requested"||g.status==="in_progress")
        st.textContent = "asked for — closes itself when the answer is published";
      else if(resolved)
        st.textContent = g.resolved_slug ? `answered by "${g.resolved_slug}"` : "answered";
      act.append(st);
      d.append(act);
      el2.append(d);
    });
  }

  async function markGap(g, btn, statusEl){
    const next = "requested";
    btn.disabled=true; const orig=btn.textContent; btn.textContent="Saving…";
    try{
      const res=await fetch("/api/gap_request",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({canonical_key:g.canonical_key, canonical_question:g.question, status:next})});
      const d=await res.json().catch(()=>({error:"bad response"}));
      if(!res.ok||d.error) throw new Error(d.error||("HTTP "+res.status));
      g.status=next;
      statusEl.textContent="asked for — closes itself when the answer is published";
      btn.remove();
    }catch(e){ btn.disabled=false; btn.textContent=orig; statusEl.textContent="failed: "+e.message; }
  }

  function passes(r){ return filt==="attention" ? (r.asked>0 && r.quality!=null && r.quality<4.0) : filt==="gaps" ? r.asked===0 : true; }

  function qRow(r){
    const notAsked=r.asked===0, ungraded=r.asked>0 && r.quality==null;
    const tr=document.createElement("tr"); tr.className="q"+(notAsked?" notasked":"");
    if(!notAsked){ tr.tabIndex=0; tr.setAttribute("aria-expanded","false"); tr.dataset.key=r.key; }
    const qCell = r.quality==null ? '<span class="dash">—</span>' : `<span class="${r.quality<3.5?'weak':''}">${r.quality.toFixed(1)}</span>`;
    const sCell = r.net_sentiment==null ? '<span class="dash">—</span>' : `<span class="${r.net_sentiment<=0?'weak':''}">${r.net_sentiment>0?'+':''}${r.net_sentiment}</span>`;
    const st = notAsked ? '<span class="state">Not asked</span>' : ungraded ? '<span class="state">Ungraded</span>' : r.quality<3.0 ? '<span class="state attn">Weak</span>' : r.quality<4.0 ? '<span class="state attn">Watch</span>' : '<span class="state">Strong</span>';
    tr.innerHTML=`<td><span class="qcell"><span class="caret">${notAsked?'':'▸'}</span><span class="qtext">${esc(r.label)}</span></span>${view==="question"?`<span class="qsub">${esc(r.cat_label)}</span>`:''}</td>
      <td class="r num">${notAsked?'<span class="dash">0</span>':r.asked}</td>
      <td class="r num">${qCell}</td>
      <td class="r num hidesm">${sCell}</td>
      <td class="r num hidesm">${st}</td>`;
    return tr;
  }
  function detailRow(r){
    const tr=document.createElement("tr"); tr.className="detail"; tr.dataset.for=r.key;
    const list=(r.answers||[]).map(a=>`<div class="ans"><div class="ans-text">${esc(a.text)}</div><div class="ans-meta">${a.quality!=null?`<span class="${a.quality<3.5?'weak':''}">${a.quality.toFixed(1)}</span>`:''}<span class="s">${SENT[a.sentiment]||''}</span></div>${a.note?`<div class="ans-note">${esc(a.note)}</div>`:''}</div>`).join("");
    tr.innerHTML=`<td colspan="5"><div class="answers">${list||'<div class="empty">Nothing recorded for this one.</div>'}</div></td>`;
    tr.style.display="none"; return tr;
  }

  function renderQuestions(){
    const body=document.getElementById("qbody"); body.innerHTML="";
    const rows=(DATA.questions||[]).filter(passes);
    if(!rows.length){ body.innerHTML=`<tr><td colspan="5" class="empty">Nothing matches this filter yet.</td></tr>`; return; }
    if(view==="category"){
      const cats=[...new Set(rows.map(r=>r.category))];
      cats.forEach(cat=>{
        const items=rows.filter(r=>r.category===cat);
        const asked=items.filter(r=>r.asked>0).length;
        const cr=document.createElement("tr"); cr.className="catrow";
        cr.innerHTML=`<td colspan="5"><span class="lbl">${esc(items[0].cat_label)}</span> <span class="cnt tnum">· ${asked}/${items.length} asked</span></td>`;
        body.appendChild(cr);
        items.forEach(r=>appendQ(body,r));
      });
    } else rows.forEach(r=>appendQ(body,r));
  }
  function appendQ(body,r){ body.appendChild(qRow(r)); if(r.asked>0) body.appendChild(detailRow(r)); }

  // Each call says where it is, so a call that arrived but hasn't been checked reads as "waiting"
  // rather than as a row that's mysteriously missing from everything above.
  const CALL_STATE = {
    graded:           ["checked",                 false],
    awaiting_grading: ["waiting to be checked",   false],
    no_transcript:    ["no transcript — can't check", true],
  };
  function renderCalls(){
    const el=document.getElementById("calls"), calls=DATA.recent_calls||[];
    document.getElementById("callcount").textContent=`${DATA.window.calls} total`;
    if(!calls.length){ el.innerHTML=`<div class="empty">No calls yet.</div>`; return; }
    el.innerHTML=calls.map(c=>{
      const authBad=c.auth_outcome==="failed";
      const authPill=c.auth_outcome?`<span class="pill ${authBad?'bad':'ok'}">${esc(c.auth_outcome)}</span>`:"";
      const outPill=c.outcome?`<span class="pill ${c.outcome==='abandoned'?'bad':'ok'}">${esc(c.outcome)}</span>`:"";
      const [stLabel, stBad] = CALL_STATE[c.state] || ["", false];
      const stPill = stLabel ? `<span class="state${stBad?" attn":""}">${esc(stLabel)}</span>` : "";
      // The provider's start time can be missing; fall back to when we received it rather than
      // showing a dash next to a call that plainly happened.
      const t = c.started_at ? when(c.started_at) : (c.arrived_at ? `received ${when(c.arrived_at)}` : "—");
      return `<div class="callrow">
        <div><span class="call-main">${esc(c.topic||"Call")}</span> <span class="call-id">${esc(shortRef(c.subject_ref))}</span>${authPill}${outPill}${stPill}</div>
        <div class="call-meta">${t} · ${dur(c.duration_seconds)} · ${SENT[c.sentiment]||"—"}</div>
      </div>`;
    }).join("");
  }

  function renderReview(){
    const el=document.getElementById("rq"), rq=DATA.review_queue||[];
    document.getElementById("rqcount").textContent=`${rq.length} flagged`;
    if(!rq.length){ el.innerHTML=`<div class="empty">Nothing here needs a second look.</div>`; return; }
    el.innerHTML=rq.map(x=>`<div class="rq-item"><div><div class="rq-topic">${esc(x.topic)} <span class="rq-id">${esc(shortRef(x.ref))}</span></div><div class="rq-reason">${esc(x.reason)}</div></div><div class="rq-meta">${esc(x.meta||"")}</div></div>`).join("");
  }

  // interactions
  document.getElementById("qbody").addEventListener("click",e=>toggle(e.target.closest("tr.q")));
  document.getElementById("qbody").addEventListener("keydown",e=>{
    if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("q")){ e.preventDefault(); toggle(e.target); }
  });
  function toggle(tr){
    if(!tr||tr.classList.contains("notasked"))return;
    const open=tr.getAttribute("aria-expanded")==="true";
    tr.setAttribute("aria-expanded",String(!open));
    const dr=tr.nextElementSibling;
    if(dr&&dr.classList.contains("detail")) dr.style.display=open?"none":"table-row";
  }
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); view=b.dataset.view; renderQuestions();
  }));
  document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-q]').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); filt=b.dataset.q; renderQuestions();
  }));
  function wireTheme(){
    const btn=document.getElementById('theme'); if(!btn)return;
    btn.addEventListener('click',()=>{
      const r=document.documentElement, cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      r.setAttribute('data-theme',cur==='dark'?'light':'dark');
    });
  }

  // Grade any not-yet-scored calls, then show the (possibly updated) metrics. Grading is a cheap
  // no-op once everything is scored, so it's safe to run on every refresh.
  //
  // Two things this used to get wrong, and both read as "unreliable":
  //  · A failing /api/grade was swallowed by an empty catch. Calls piled up unchecked and the
  //    dashboard said nothing, so the table just stayed stale. Now the failure is reported.
  //  · Grading is capped at ten calls per request, and one pass per 30s meant a backlog of
  //    thirty calls took a minute and a half to clear with no sign it was working. It now keeps
  //    going while there's more to do.
  const MAX_ROUNDS = 6;
  let ticking = false;
  async function tick(){
    if(ticking) return;                        // a slow round must not stack up behind the timer
    ticking = true;
    try{
      await load();                            // show current state immediately
      for(let round=0; round<MAX_ROUNDS; round++){
        let g;
        try{
          const r = await fetch("/api/grade", { method:"POST" });
          g = await r.json().catch(()=>null);
          if(!r.ok || (g && g.error)) throw new Error((g && g.error) || ("HTTP "+r.status));
          GRADE_ERR = null;
        }catch(e){
          GRADE_ERR = e.message;
          if(DATA) renderPipeline();           // say so instead of failing quietly
          break;
        }
        if(!g || !g.graded) break;             // nothing left to score
        await load();
        if(!g.pending || g.pending < 10) break; // that was the last batch
      }
    } finally { ticking = false; }
  }
  wireTheme();
  loadHealth().then(tick);
  setInterval(tick, 30000); // refresh + grade any new calls every 30s
</script>
</body>
</html>
