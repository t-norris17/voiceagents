<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robin — Would they rather use her?</title>
<style>

  :root {
    --paper:#f2f0ea; --ink:#17181c; --sub:#6c7075; --faint:#a29e95;
    --line:#d7d3c9; --hair:#e4e1d8;
    --accent:#b8501e;
    --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#15161a; --ink:#ecebe6; --sub:#9a9ea4; --faint:#6a6e74;
      --line:#2b2d33; --hair:#212329; --accent:#e08a4a; }
  }
  :root[data-theme="light"]{ --paper:#f2f0ea; --ink:#17181c; --sub:#6c7075; --faint:#a29e95; --line:#d7d3c9; --hair:#e4e1d8; --accent:#b8501e; }
  :root[data-theme="dark"]{ --paper:#15161a; --ink:#ecebe6; --sub:#9a9ea4; --faint:#6a6e74; --line:#2b2d33; --hair:#212329; --accent:#e08a4a; }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.5; -webkit-font-smoothing:antialiased; }
  .sheet{ max-width:820px; margin:0 auto; padding:clamp(28px,6vw,64px) clamp(20px,5vw,44px) 60px; }
  .tnum{ font-variant-numeric:tabular-nums; }
  .lbl{ font-size:.66rem; text-transform:uppercase; letter-spacing:.2em; color:var(--sub); font-weight:600; }
  .accent{ color:var(--accent); }

  .mast{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
  .mast .wm{ font-size:1.4rem; font-weight:800; letter-spacing:.02em; text-transform:uppercase; margin:0; }
  .mast .meta{ font-size:.72rem; color:var(--sub); text-align:right; line-height:1.7; letter-spacing:.02em; }
  .mast .meta b{ color:var(--ink); font-weight:600; }
  .themebtn{ font:inherit; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; background:none; border:0; color:var(--sub); cursor:pointer; padding:0; margin-left:10px; }
  .themebtn:hover{ color:var(--ink); }

  .verdict{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:38px; }
  .v{ padding:2px 24px; border-left:1px solid var(--line); }
  .v:first-child{ padding-left:0; border-left:0; }
  .v .k{ margin-bottom:14px; }
  .v .fig{ font-size:clamp(2.6rem,7vw,3.5rem); font-weight:800; line-height:.9; letter-spacing:-.03em; }
  .v .fig .un{ font-size:1rem; font-weight:600; color:var(--sub); letter-spacing:0; margin-left:4px; }
  .v .note{ font-size:.8rem; color:var(--sub); margin-top:12px; line-height:1.45; }
  .v .note b{ color:var(--ink); font-weight:600; }

  .xlink{ font-size:.7rem; color:var(--faint); }
  .xlink a{ color:var(--sub); }
  hr.rule{ border:0; border-top:1px solid var(--line); margin:44px 0 0; }

  section{ margin-top:40px; }
  .shead{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:2px; }
  .tabset{ display:flex; gap:18px; }
  .tabset button{ font:inherit; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); background:none; border:0; padding:0 0 4px; cursor:pointer; border-bottom:2px solid transparent; }
  .tabset button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--ink); }
  .tabset button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  thead th{ font-size:.62rem; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); font-weight:600; text-align:left; padding:14px 0 8px; border-bottom:1px solid var(--ink); }
  th.r,td.r{ text-align:right; }
  thead th.r{ padding-left:26px; white-space:nowrap; }

  .catrow td{ padding:22px 0 7px; border-bottom:1px solid var(--ink); }
  .catrow .lbl{ letter-spacing:.16em; }
  .catrow .cnt{ color:var(--faint); font-weight:400; }

  tr.q{ cursor:pointer; }
  tr.q > td{ padding:11px 0; border-bottom:1px solid var(--hair); }
  tr.q:hover > td{ color:var(--ink); }
  tr.q:hover .qtext{ text-decoration:underline; text-underline-offset:3px; }
  tr.q:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .qcell{ font-weight:600; display:flex; align-items:baseline; gap:9px; }
  .caret{ color:var(--faint); font-size:.7rem; width:9px; flex:none; transition:transform .15s ease; display:inline-block; }
  tr.q[aria-expanded="true"] .caret{ transform:rotate(90deg); color:var(--ink); }
  .qsub{ display:block; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400; margin:2px 0 0 18px; }
  td.r.num{ font-variant-numeric:tabular-nums; width:1%; white-space:nowrap; padding-left:26px; }
  .weak{ color:var(--accent); font-weight:700; }
  .dash{ color:var(--faint); }
  .state{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); white-space:nowrap; }
  .state.attn{ color:var(--accent); font-weight:700; }
  tr.q.notasked{ cursor:default; }
  tr.q.notasked:hover .qtext{ text-decoration:none; }

  tr.detail > td{ padding:0; border-bottom:1px solid var(--hair); }
  .answers{ margin:2px 0 14px 18px; padding-left:16px; border-left:1px solid var(--line); }
  .ans{ display:grid; grid-template-columns:1fr auto; gap:4px 18px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--hair); }
  .ans:last-child{ border-bottom:0; }
  .ans-text{ font-size:.86rem; color:var(--ink); }
  .ans-meta{ font-size:.72rem; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ans-meta .s{ margin-left:10px; }
  .ans-note{ grid-column:1/-1; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:600; margin-top:2px; }

  .rq-item{ display:grid; grid-template-columns:1fr auto; gap:6px 16px; padding:12px 0; border-bottom:1px solid var(--hair); align-items:baseline; }
  .rq-item:last-child{ border-bottom:0; }
  .rq-topic{ font-weight:600; } .rq-id{ font-size:.72rem; color:var(--faint); letter-spacing:.03em; }
  .rq-reason{ font-size:.78rem; color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .rq-meta{ font-size:.78rem; color:var(--sub); }

  .callrow{ display:grid; grid-template-columns:1fr auto; gap:2px 16px; padding:11px 0; border-bottom:1px solid var(--hair); align-items:baseline; }
  .callrow:last-child{ border-bottom:0; }
  .call-main{ font-weight:600; font-size:.9rem; }
  .call-id{ font-size:.7rem; color:var(--faint); letter-spacing:.03em; }
  .call-meta{ font-size:.78rem; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pill{ font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; padding:1px 7px; border:1px solid var(--line); border-radius:2px; margin-left:8px; }
  .pill.ok{ color:var(--sub); } .pill.bad{ color:var(--accent); border-color:var(--accent); }

  /* utilization — one bar, read left to right: answered | fixable gap | not-content */
  .util{ margin-top:10px; }
  .util .fig{ font-size:clamp(2.6rem,7vw,3.5rem); font-weight:800; line-height:.9; letter-spacing:-.03em; }
  .util .fig .un{ font-size:1rem; font-weight:600; color:var(--sub); letter-spacing:0; margin-left:4px; }
  .bar{ display:flex; height:14px; margin:16px 0 10px; border:1px solid var(--ink); background:var(--paper); overflow:hidden; }
  .bar span{ display:block; height:100%; }
  .bar .b-ans{ background:var(--ink); }
  .bar .b-gap{ background:var(--accent); }
  .bar .b-oos{ background:var(--line); }
  .key{ display:flex; gap:18px; flex-wrap:wrap; font-size:.72rem; color:var(--sub); }
  .key i{ display:inline-block; width:9px; height:9px; margin-right:6px; border:1px solid var(--ink); vertical-align:baseline; }
  .key .k-ans i{ background:var(--ink); } .key .k-gap i{ background:var(--accent); } .key .k-oos i{ background:var(--line); }

  .gap{ display:grid; grid-template-columns:1fr auto; gap:4px 16px; padding:13px 0; border-bottom:1px solid var(--hair); align-items:baseline; }
  .gap:last-child{ border-bottom:0; }
  .gap-q{ font-weight:600; }
  .gap-meta{ font-size:.72rem; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .gap-why{ grid-column:1/-1; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; font-weight:600; color:var(--accent); }
  .gap-why.soft{ color:var(--faint); }
  .gap-sample{ grid-column:1/-1; font-size:.8rem; color:var(--sub); font-style:italic; }
  .gap-act{ grid-column:1/-1; margin-top:6px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .gap-act button{ font:inherit; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; background:none; border:1px solid var(--line); color:var(--sub); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .gap-act button:hover{ border-color:var(--accent); color:var(--accent); }
  .gap-act button[disabled]{ opacity:.55; cursor:default; }
  .gap-status{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); }


  .empty{ color:var(--faint); font-size:.85rem; font-style:italic; padding:16px 0; }
  .banner{ font-size:.72rem; letter-spacing:.04em; color:var(--sub); background:var(--hair); padding:9px 14px; border-radius:2px; margin-top:18px; }

  footer{ margin-top:52px; padding-top:14px; border-top:1px solid var(--line); font-size:.68rem; letter-spacing:.04em; color:var(--faint); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  @media (max-width:640px){
    .verdict{ grid-template-columns:1fr; gap:28px; } .v{ padding:0; border-left:0; }
    .v+.v{ border-top:1px solid var(--line); padding-top:24px; }
    thead .hidesm, td.hidesm{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }

  /* ---- SURVEY (temporary; delete this block with the instrument) ------------------------- */
  .svy{ margin-top:10px; }
  .svy-head{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
  .svy-tag{ font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600;
    border:1px solid var(--line); padding:2px 7px; white-space:nowrap; }
  .svy-lede{ font-size:.82rem; color:var(--sub); margin:12px 0 0; max-width:56ch; line-height:1.5; }
  .svy-head-fig{ display:flex; align-items:baseline; gap:14px; margin-top:22px; }
  .svy-head-fig .fig{ font-size:clamp(3rem,9vw,4.4rem); font-weight:800; line-height:.85; letter-spacing:-.035em; }
  .svy-head-fig .un{ font-size:.95rem; font-weight:600; color:var(--sub); }
  .svy-head-fig .vs{ font-size:.82rem; color:var(--sub); line-height:1.45; }
  .svy-head-fig .vs b{ color:var(--ink); }
  .bar .b-agent{ background:var(--ink); }
  .bar .b-none{ background:var(--line); }
  .bar .b-person{ background:var(--accent); }
  .key .k-agent i{ background:var(--ink); } .key .k-none i{ background:var(--line); } .key .k-person i{ background:var(--accent); }
  .svy-moe{ font-size:.72rem; color:var(--faint); margin-top:10px; line-height:1.5; }
  .svy-moe b{ color:var(--sub); font-weight:600; }
  .svy-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:0; margin-top:30px;
    border-top:1px solid var(--line); }
  .svy-m{ padding:16px 16px 4px; border-left:1px solid var(--line); }
  .svy-m:first-child{ padding-left:0; border-left:0; }
  .svy-m .n{ font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1; }
  .svy-m .n .un{ font-size:.8rem; font-weight:600; color:var(--sub); margin-left:2px; letter-spacing:0; }
  .svy-m .cap{ font-size:.72rem; color:var(--sub); margin-top:9px; line-height:1.45; }
  .svy-m.warn .n{ color:var(--accent); }
  .svy-alarm{ font-size:.78rem; color:var(--accent); font-weight:600; border:1px solid var(--accent);
    padding:11px 14px; margin-top:24px; line-height:1.5; }
  .svy-cm{ margin-top:30px; padding-top:18px; border-top:1px solid var(--line); }
  .svy-cmt{ font-size:.86rem; line-height:1.55; padding:9px 0; border-bottom:1px solid var(--hair); }
  .svy-cmt:last-child{ border-bottom:0; }
  .svy-cmt.redacted{ color:var(--faint); font-style:italic; font-size:.78rem; }
  .svy-vb{ margin-top:30px; border-top:1px solid var(--ink); }
  .svy-q{ display:grid; grid-template-columns:1fr auto; gap:3px 18px; padding:12px 0; border-bottom:1px solid var(--hair);
    align-items:baseline; }
  .svy-q:last-child{ border-bottom:0; }
  .svy-q .said{ font-size:.86rem; }
  .svy-q .said .lead{ color:var(--faint); }
  .svy-q .tagp{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); white-space:nowrap; }
  .svy-q .tagp.person{ color:var(--accent); font-weight:700; }
  .svy-q .tagp.unclassified{ color:var(--accent); }
  .svy-q .sc{ font-size:.78rem; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* ---- end survey ------------------------------------------------------------------------ */

</style>
</head>
<body>
<div class="sheet">

  <div class="mast">
    <h1 class="wm">Robin · Survey</h1>
    <div class="meta" id="mastmeta"></div>
  </div>

  <div id="banner"></div>

  <section id="svysec" hidden>
    <div class="shead svy-head">
      <div class="lbl">Would they rather use Robin? · <span id="svymeta"></span></div>
      <span class="svy-tag">Test instrument</span>
    </div>
    <div id="svy"></div>
  </section>

  <footer>
    <span>Robin · Vertex Manufacturing 401(k) · <span id="gen"></span></span>
    <span class="xlink">Call quality and coverage live on the <a href="/dashboard/">experiment monitor</a>.</span>
  </footer>
</div>

<script>
  const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let DATA=null;

  // Reads the same /api/metrics the monitor does, but renders ONLY its `survey` block. The survey is a
  // temporary instrument on its own page so that removing it later is deleting a directory, and so this
  // page can be handed to someone without also handing them the operational monitor.
  async function load(){
    try{
      const r=await fetch("/api/metrics",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      DATA=await r.json();
      document.getElementById("banner").innerHTML="";
      document.getElementById("mastmeta").innerHTML=
        `<b>${DATA.window?.calls ?? 0}</b> call${DATA.window?.calls===1?"":"s"} on record<br>`+
        `<span class="soft">last updated <span id="gen2"></span></span>`;
      renderSurvey();
      stamp();
    }catch(e){
      document.getElementById("banner").innerHTML=
        `<div class="banner">Couldn't load live data: ${esc(e.message)}. Retrying…</div>`;
    }
  }

  function stamp(){
    const t=new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    for(const id of ["gen","gen2"]){ const el=document.getElementById(id); if(el) el.textContent=t; }
  }

  // ---- SURVEY (temporary; delete with the instrument) --------------------------------------
  // Ordered by what can mislead you fastest, not by what's most interesting:
  //   1. adherence — if she isn't asking, every number under it comes from a biased slice
  //   2. the preference split, with its margin of error attached, because at n=30 a 60/40 is noise
  //   3. what people actually said, so the buckets above stay auditable
  function renderSurvey(){
    const sec=document.getElementById("svysec"), el=document.getElementById("svy"), s=DATA.survey;
    if(!s){ sec.hidden=true; return; }          // survey removed, or the block failed server-side
    sec.hidden=false;

    if(s.awaiting_first_call || !s.calls){
      document.getElementById("svymeta").textContent="";
      el.innerHTML=`<div class="empty">Live. No calls recorded since the questions went on; this fills in with the first one.</div>`;
      return;
    }

    const a=s.adherence||{}, r=s.response||{}, p=s.preference||{}, sat=s.satisfaction||{},
          rec=s.recommend||{}, com=s.comments||{};
    document.getElementById("svymeta").textContent=
      `${s.calls} call${s.calls===1?"":"s"} since it went live`;

    // Headline. Only claim a winner once the gap clears the margin; otherwise say it's too close.
    const gap=Math.abs((p.agent_pct??0)-(p.person_pct??0));
    const tooClose = p.decided>0 && gap<=(p.margin_pts??99);
    const headFig = p.decided
      ? `<div class="svy-head-fig">
           <div><div class="fig tnum">${p.agent_pct}<span class="un">%</span></div></div>
           <div class="vs">chose <b>Robin</b> over holding for a person.<br>
             ${p.person_pct}% would rather wait for a person; ${Math.max(0,100-p.agent_pct-p.person_pct)}% had no preference.</div>
         </div>`
      : `<div class="empty">Nobody has answered the preference question yet.</div>`;

    const pc=(n)=>p.decided?((n/p.decided)*100).toFixed(2)+"%":"0%";
    const bar = p.decided ? `
      <div class="bar" role="img" aria-label="${p.agent} chose Robin, ${p.no_preference} no preference, ${p.person} chose a person">
        <span class="b-agent" style="width:${pc(p.agent)}"></span>
        <span class="b-none" style="width:${pc(p.no_preference)}"></span>
        <span class="b-person" style="width:${pc(p.person)}"></span>
      </div>
      <div class="key">
        <span class="k-agent"><i></i>${p.agent} would use Robin again</span>
        <span class="k-none"><i></i>${p.no_preference} no preference</span>
        <span class="k-person"><i></i>${p.person} would rather have a person</span>
      </div>
      <div class="svy-moe">
        Based on <b>${p.decided} answer${p.decided===1?"":"s"}</b>, so the true figure is roughly
        <b>±${p.margin_pts} points</b>.
        ${tooClose
          ? `The gap here is ${gap} point${gap===1?"":"s"} — inside the margin, so this is <b>too close to call yet</b>.`
          : `The gap is ${gap} points, wider than the margin.`}
        Count one answer per person, not per call.
      </div>` : "";

    const adherenceWarn = a.pct!=null && a.pct<70;
    const metrics=[
      a.eligible ? `<div class="svy-m${adherenceWarn?" warn":""}">
          <div class="n tnum">${a.pct}<span class="un">%</span></div>
          <div class="cap">of eligible calls had the survey asked — ${a.asked_when_eligible} of ${a.eligible}.
          ${adherenceWarn?"<b>Low. The figures above rest on a thin sample.</b>":""}</div>
        </div>` : "",
      `<div class="svy-m">
          <div class="n tnum">${r.rate_pct??"—"}${r.rate_pct!=null?'<span class="un">%</span>':""}</div>
          <div class="cap">of people asked gave an answer — ${r.answered} of ${r.offered}.
          ${r.declined?`${r.declined} declined.`:""}</div>
        </div>`,
      rec.answered ? `<div class="svy-m">
          <div class="n tnum">${rec.yes_pct!=null?rec.yes_pct:"—"}${rec.yes_pct!=null?'<span class="un">%</span>':""}</div>
          <div class="cap">would recommend it to someone else — ${rec.yes} yes, ${rec.no} no.${rec.unclear?` ${rec.unclear} unclear.`:""}</div>
        </div>` : "",
      sat.n ? `<div class="svy-m">
          <div class="n tnum">${sat.mean}<span class="un">/5</span></div>
          <div class="cap">average rating across ${sat.n} answer${sat.n===1?"":"s"};
          ${sat.four_or_five} gave a 4 or 5.${sat.unparsed?` ${sat.unparsed} answered in words we couldn't score.`:""}</div>
        </div>` : "",
      a.ineligible ? `<div class="svy-m">
          <div class="n tnum">${a.ineligible}</div>
          <div class="cap">calls correctly excluded — transferred, or verification failed.</div>
        </div>` : "",
    ].filter(Boolean).join("");

    // Should always be zero. Anything here means the prompt gate leaked on a transfer.
    const alarm = s.leaked_pre_transfer
      ? `<div class="svy-alarm">${s.leaked_pre_transfer} call${s.leaked_pre_transfer===1?"":"s"} were surveyed on the way into a transfer.
         She's told never to do that — the gate has leaked. Worth listening to those calls.</div>` : "";

    const vb = (s.verbatims||[]).length ? `
      <div class="svy-vb">
        ${s.verbatims.map(v=>`
          <div class="svy-q">
            <div class="said">${v.prefer_agent?`<span class="lead">“</span>${esc(v.prefer_agent)}<span class="lead">”</span>`:`<span class="lead">— no answer to the second question —</span>`}</div>
            <div class="tagp ${esc(v.preference||"")}">${esc((v.preference||"").replace("_"," "))}</div>
            <div class="sc">${v.satisfaction?`rated ${esc(v.satisfaction)}`:`<span class="lead">no rating</span>`}</div>
          </div>`).join("")}
      </div>` : "";

    // Free-text answers. The count of dropped ones is shown so the redaction RATE stays visible
    // even though the words never do — that number is the compliance answer if anyone asks.
    const comments = (com.recent||[]).length || com.redacted ? `
      <div class="svy-cm">
        <div class="lbl" style="margin-bottom:6px">In their own words${com.redacted?` · <span class="accent">${com.redacted} withheld</span>`:""}</div>
        ${(com.recent||[]).map(c=>`<div class="svy-cmt">“${esc(c.text)}”</div>`).join("")}
        ${com.redacted?`<div class="svy-cmt redacted">${com.redacted} answer${com.redacted===1?" was":"s were"} dropped for containing something
          personal — an account number, a Social Security Number or similar. The rate is kept, the words are not.</div>`:""}
      </div>` : "";

    el.innerHTML=`<div class="svy">
      <p class="svy-lede">Four questions at the end of a normal call, for the testing phase only. Not asked on transfers, or on
        callers who could not be verified. Testers are briefed beforehand, so the questions are stated
        rather than offered.</p>
      ${headFig}${bar}${metrics?`<div class="svy-grid">${metrics}</div>`:""}${alarm}${comments}${vb}
    </div>`;
  }
  // ---- end survey ---------------------------------------------------------------------------

  load();
  setInterval(load, 60000);
</script>
